name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    # Katib targets Windows only; run the suite on the real platform.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          # The same interpreter the release build uses (ADR-0011).
          python-version-file: ".python-version"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt
      - name: Run tests
        run: python -m pytest -p no:cacheprovider --cov-report=term
